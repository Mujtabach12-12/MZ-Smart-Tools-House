<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#2563eb"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="MZ Smart Tool House"/>

<meta name="description" content="Free online calculators, PDF tools, image utilities and developer tools for work, study and everyday productivity. Fast, simple and privacy-conscious."/>
<link rel="canonical" href="https://mztoolshouse.com/"/>
<meta property="og:type" content="website"/>
<meta property="og:locale" content="en_US"/>
<meta property="og:site_name" content="MZ Smart Tool House"/>
<meta property="og:title" content="MZ Smart Tool House — Smart tools for work, study & productivity."/>
<meta property="og:description" content="Free online calculators, PDF tools, image utilities and developer tools for work, study and everyday productivity."/>
<meta property="og:url" content="https://mztoolshouse.com/"/>
<meta property="og:image" content="https://mztoolshouse.com/assets/mz-smart-office-hero.webp"/>
<meta property="og:image:alt" content="MZ Smart Tool House smart office productivity tools"/>
<meta name="twitter:card" content="summary_large_image"/>

<link rel="apple-touch-icon" href="/icons/icon-192.png"/>

    <link rel="manifest" href="/manifest.webmanifest"/>
<script>(function(){try{var s=localStorage.getItem("mz-theme"),d=window.matchMedia("(prefers-color-scheme: dark)").matches;if(s==="dark"||(s!=="light"&&d))document.documentElement.classList.add("dark")}catch(e){}})();</script>
</head>
<body class="bg-white dark:bg-navy-950 text-navy-900 dark:text-navy-50">
<!-- Native/Android-first startup overlay. It is intentionally in index.html so it appears before React finishes loading. -->
<div id="mz-native-startup" class="mz-native-startup" role="status" aria-live="polite" aria-label="Welcome to MZ Tools">
  <div class="mz-native-startup-glow mz-native-startup-glow-a"></div>
  <div class="mz-native-startup-glow mz-native-startup-glow-b"></div>
  <div class="mz-native-startup-inner">
    <div class="mz-native-startup-logo-wrap">
      <img src="/icons/icon-512.png" width="512" height="512" alt="MZ Tools" class="mz-native-startup-logo">
    </div>
    <div class="mz-native-startup-kicker">WELCOME TO</div>
    <h1>MZ <span>Tools</span></h1>
    <p class="mz-native-startup-subtitle">Your Smart Tool House <span aria-hidden="true">🏠</span></p>
    <div class="mz-native-startup-video-wrap">
      <video src="/startup/mz-office-welcome.mp4" poster="/icons/icon-512.png" autoplay muted playsinline loop preload="auto" class="mz-native-startup-video" aria-hidden="true"></video>
    </div>
    <div class="mz-native-startup-message">
      <span class="mz-native-startup-spinner"></span>
      <span>Getting your smart tools ready…</span>
    </div>
    <div class="mz-native-startup-progress"><span></span></div>
    <div class="mz-native-startup-dots"><i></i><i></i><i></i></div>
    <p class="mz-native-startup-footer">Smart Tools • Better Life</p>
  </div>
</div>

<form name="mz-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="mz-feedback"/>
  <input name="name"/><input name="email"/><input name="category"/><input name="rating"/><textarea name="message"></textarea>
  <input name="page"/><input name="device"/><input name="createdAt"/><input name="id"/><input name="bot-field"/>
</form>
<div id="root"></div><script type="module" src="/src/main.jsx"></script>
</body>
</html>
