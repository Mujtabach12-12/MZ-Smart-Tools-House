<!-- Branded first-paint tools loader. No video asset; the requested 5–7 second sequence keeps tool names readable while the app starts. -->
<div id="mz-native-startup" class="mz-native-startup" role="status" aria-live="polite" aria-label="Loading MZ Smart Tool House">
  <div class="mz-native-startup-glow mz-native-startup-glow-a"></div>
  <div class="mz-native-startup-glow mz-native-startup-glow-b"></div>
  <div class="mz-native-startup-inner">
    <div class="mz-tool-loader" aria-hidden="true">
      <div class="mz-tool-loader-orbit">
        <span class="mz-tool-chip mz-tool-chip-a">PDF</span>
        <span class="mz-tool-chip mz-tool-chip-b">CODE</span>
        <span class="mz-tool-chip mz-tool-chip-c">IMAGE</span>
        <span class="mz-tool-chip mz-tool-chip-d">CALC</span>
      </div>
      <div class="mz-native-startup-logo-wrap">
        <img src="/icons/icon-512.png" width="512" height="512" alt="MZ Smart Tool House" class="mz-native-startup-logo">
      </div>
    </div>
    <h1>MZ <span>Smart Tool House</span></h1>
    <p class="mz-native-startup-subtitle">Loading your smart workspace</p>
    <div class="mz-startup-tool-name"><span>Preparing</span><strong data-mz-startup-tool>PDF Tools</strong></div>
    <div class="mz-startup-progress" aria-hidden="true"><i data-mz-startup-progress></i></div>
    <p class="mz-native-startup-developer">Developed by <strong>Muhammad Mujtaba</strong></p>
  </div>
</div>

<form name="mz-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="mz-feedback"/>
  <input name="name"/><input name="email"/><input name="category"/><input name="rating"/><textarea name="message"></textarea>
  <input name="page"/><input name="device"/><input name="tool"/><input name="reaction"/><input name="createdAt"/><input name="id"/><input name="bot-field"/>
</form>
<div id="root"></div><script type="module" src="/src/main.jsx"></script>
